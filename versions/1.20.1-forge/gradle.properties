# Gradle
# The machine's default java is Zulu 25, which Gradle 8.10 / ForgeGradle 6 cannot read (class file 69).
# 构建用的 JDK 由 JAVA_HOME 指定（本机路径不入库）
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Environment
minecraft_version=1.20.1
forge_version=47.4.28
netmusic_version=1.5.2-forge+mc1.20.1
curios_version=5.14.1+1.20.1

# Mod
mod_id=netmusicplus
mod_name=Net Music Plus
mod_license=MIT
mod_version=1.0.2
mod_group_id=com.wuliaoppx.netmusicplus
mod_authors=wuliaoppx
mod_description=Adds an Amplifier enchantment (levels I-III, 200% / 300% / 400%) for NetMusic music players. Apply an amplifier book with an anvil to widen the player's audible range.
# Local HTTP proxy (Gradle toolchain provisioning + dependency download; the JVM ignores HTTP_PROXY env vars)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]
# JDK 17 (FG6 MCP steps) is not in a standard location. It must live on an ASCII-only path:
# a JDK under a non-ASCII path fails to create files (AccessDeniedException) on this machine.
org.gradle.java.installations.fromEnv=JDK17_HOME
