org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
# 构建用的 JDK 由 JAVA_HOME 指定（本机路径不入库）

minecraft_version=26.1.2
neoforge_version=26.1.2.122
moddev_version=2.0.148
curios_version=15.0.0+26.1.2

mod_version=1.0.3
# Local HTTP proxy (the JVM does not read HTTP_PROXY/HTTPS_PROXY from the environment)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]
